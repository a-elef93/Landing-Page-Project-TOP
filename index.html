<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowSpace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="top-section">
        <div class="header">
            <img class="logo" src="images/flowspace-logo.png" alt="FlowSpace logo">
            <h1>FlowSpace</h1>

                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Contact Us</a></li>
                </ul>
            </div>

            <div class="content">
                <p>Create a workspace that inspires creativity, improves productivity and helps you do yourbest work every day.</p>
            </div>
            <img class="hero-logo" src="images/setup-image.PNG" alt="Minimal setup example">
